<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Banking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card">
      <h1>Log in</h1>
      <div id="msg" class="msg" hidden></div>
      <form id="form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="submit" class="btn btn-block" type="submit">Log in</button>
      </form>
      <p class="center hint">New here? <a class="link" href="register.html">Create an account</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      if (Session.get()) {
        window.location.replace("dashboard.html");
        return;
      }

      const msg = $("msg");
      const btn = $("submit");

      if (new URLSearchParams(window.location.search).get("registered") === "1") {
        showMessage(msg, "Registration successful. Please log in.", "success");
      }

      $("form").addEventListener("submit", async function (e) {
        e.preventDefault();
        hideMessage(msg);

        const email = $("email").value.trim();
        const password = $("password").value;
        if (!email || !password) return showMessage(msg, "Email and password are required", "error");

        setBusy(btn, true, "Logging in...");
        try {
          await Api.login({ email: email, password: password });
          window.location.replace("dashboard.html");
        } catch (err) {
          showMessage(msg, err.message, "error");
          setBusy(btn, false);
        }
      });
    })();
  </script>
</body>
</html>
