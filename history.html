<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>History - Banking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav" class="nav"></nav>
<main class="container">
    <h1>Transfer history</h1>
    <div id="msg" class="msg" hidden></div>
    <section class="card">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Date</th><th>Reference</th><th>From</th><th>To</th>
                    <th>Amount</th><th>Fee</th><th>Status</th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
        <p id="empty" class="hint" hidden>No transfers yet.</p>
    </section>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
    (async function () {
        if (!requireAuth()) return;
        renderNav("history.html");

        const msg = $("msg");
        if (CONFIG.USE_MOCK) {
            showMessage(msg, "Mock mode: history shows fake test data from this browser tab.", "info");
        }

        try {
            const items = await Api.listTransfers();
            const body = $("rows");
            body.textContent = "";

            if (!items || items.length === 0) {
                $("empty").hidden = false;
                return;
            }

            items.forEach((t) => {
                const tr = document.createElement("tr");
                [
                    formatDate(t.createdAt),
                    t.transferId,
                    t.fromAccountNumber,
                    t.toAccountNumber,
                    formatMoney(t.amount),
                    formatMoney(t.fee)
                ].forEach((value) => tr.appendChild(makeEl("td", "", value)));

                const status = makeEl("td");
                status.appendChild(makeEl("span", "status " + (t.status || ""), t.status || ""));
                tr.appendChild(status);
                body.appendChild(tr);
            });
        } catch (err) {
            showMessage(msg, err.message, "error");
        }
    })();
</script>
</body>
</html>
