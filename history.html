<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History - Banking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav" class="nav"></nav>
  <main class="container">
    <h1>Transfer history</h1>
    <div id="msg" class="msg" hidden></div>
    <section class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Reference</th><th>Type</th><th>From</th><th>To</th>
              <th>Amount</th><th>Fee</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="hint" hidden>No transfers yet.</p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (async function () {
      if (!requireAuth()) return;
      renderNav("history.html");

      const msg = $("msg");
      const body = $("rows");

      async function retry(id, btn) {
        hideMessage(msg);
        setBusy(btn, true, "Retrying...");
        try {
          const res = await Api.confirmTransfer(id);
          const ok = res.status === "SUCCESS";
          showMessage(msg, ok ? "Transfer " + id + " completed" : (res.message || "Transfer not completed"),
            ok ? "success" : "error");
          await load();
        } catch (err) {
          showMessage(msg, err.message, "error");
          setBusy(btn, false);
        }
      }

      async function load() {
        try {
          const items = await Api.listTransfers();
          body.textContent = "";
          $("empty").hidden = Boolean(items && items.length > 0);

          (items || []).forEach(function (t) {
            const tr = document.createElement("tr");
            [
              formatDate(t.createdAt),
              t.transferId,
              t.type || "TRANSFER",
              t.fromAccountNumber,
              t.toAccountNumber,
              formatMoney(t.amount),
              formatMoney(t.fee)
            ].forEach(function (value) { tr.appendChild(makeEl("td", "", value)); });

            const status = makeEl("td");
            status.appendChild(makeEl("span", "status " + (t.status || ""), t.status || ""));
            tr.appendChild(status);

            const action = makeEl("td");
            if (t.status === "UNCONFIRMED") {
              const btn = makeEl("button", "btn btn-small", "Retry");
              btn.addEventListener("click", function () { retry(t.transferId, btn); });
              action.appendChild(btn);
            } else if (t.status === "PENDING_OTP") {
              action.appendChild(makeEl("span", "hint", "Waiting for OTP"));
            }
            tr.appendChild(action);

            body.appendChild(tr);
          });
        } catch (err) {
          showMessage(msg, err.message, "error");
        }
      }

      load();
    })();
  </script>
</body>
</html>
