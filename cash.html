<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deposit / Withdraw - Banking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav" class="nav"></nav>
<main class="container">
    <h1>Deposit or withdraw</h1>
    <div id="msg" class="msg" hidden></div>

    <section id="formCard" class="card">
        <form id="form1" novalidate>
            <div class="form-group">
                <label for="kind">What do you want to do?</label>
                <select id="kind">
                    <option value="deposit">Deposit money</option>
                    <option value="withdraw">Withdraw money</option>
                </select>
                <div id="kindHint" class="hint"></div>
            </div>
            <div class="form-group">
                <label for="account">Account</label>
                <select id="account"></select>
            </div>
            <div class="form-group">
                <label for="amount">Amount</label>
                <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
                <div class="hint">Up to 1,000,000.00 with at most 2 decimals. No fee.</div>
            </div>
            <button id="submit1" class="btn" type="submit">Continue</button>
        </form>
    </section>

    <section id="flow" hidden></section>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/flow.js"></script>
<script>
    (async function () {
        const session = requireAuth();
        if (!session) return;
        renderNav("cash.html");

        const msg = $("msg");
        const formCard = $("formCard");
        const accountSel = $("account");
        let accounts = [];

        function updateKindHint() {
            $("kindHint").textContent = $("kind").value === "withdraw"
                ? "A withdrawal needs a one-time password."
                : "A deposit is added to your account right away.";
        }

        async function loadAccounts() {
            const all = await Api.listAccounts();
            accounts = all.filter(function (a) { return !a.status || a.status === "ACTIVE"; });

            const previous = accountSel.value;
            accountSel.textContent = "";
            accounts.forEach(function (a) {
                const opt = document.createElement("option");
                opt.value = a.accountNumber;
                opt.textContent = a.accountNumber + " (" + formatMoney(a.balance, a.currency) + ")";
                accountSel.appendChild(opt);
            });
            if (previous) accountSel.value = previous;

            $("submit1").disabled = accounts.length === 0;
            if (accounts.length === 0) {
                showMessage(msg, "You need an active account first. Open one on the dashboard.", "error");
            }
        }

        function showForm() {
            flow.hide();
            formCard.hidden = false;
            window.history.replaceState(null, "", "cash.html");
            hideMessage(msg);
            $("amount").value = "";
            loadAccounts().catch(function (err) { showMessage(msg, err.message, "error"); });
        }

        const flow = TxFlow.create($("flow"), {
            onNew: showForm,
            onFinished: function () {
                loadAccounts().catch(function () { /* the balances refresh when the form is shown again */ });
            }
        });

        $("kind").addEventListener("change", updateKindHint);
        updateKindHint();

        $("form1").addEventListener("submit", async function (e) {
            e.preventDefault();
            hideMessage(msg);

            const kind = $("kind").value;
            const accountNumber = accountSel.value;
            const amountText = $("amount").value.trim();

            if (!accountNumber) return showMessage(msg, "Choose an account", "error");
            if (!/^\d+(\.\d{1,2})?$/.test(amountText) || Number(amountText) <= 0) {
                return showMessage(msg, "Enter a valid amount greater than 0 (max 2 decimals)", "error");
            }
            if (Number(amountText) > 1000000) {
                return showMessage(msg, "The maximum amount is 1,000,000.00", "error");
            }
            const amount = Number(amountText);

            const btn = $("submit1");
            setBusy(btn, true, "Sending...");
            try {
                const payload = { accountNumber: accountNumber, amount: amount };
                const tx = kind === "deposit"
                    ? await Api.initiateDeposit(payload)
                    : await Api.initiateWithdrawal(payload);

                if (tx.status !== "VALIDATING") {
                    showMessage(msg, "The server still runs the old synchronous flow. "
                        + "Start fund-transfer-service with TRANSFER_SAGA_ENABLED=true.", "error");
                } else {
                    formCard.hidden = true;
                    window.history.replaceState(null, "", "cash.html?id=" + encodeURIComponent(tx.transferId));
                    flow.track(tx.transferId);
                }
            } catch (err) {
                showMessage(msg, err.message, "error");
            }
            setBusy(btn, false);
        });

        // A reload (or a link from History) resumes a running request.
        const resumeId = new URLSearchParams(window.location.search).get("id");
        if (resumeId) {
            formCard.hidden = true;
            flow.track(resumeId);
            loadAccounts().catch(function () { /* not needed to follow the request */ });
        } else {
            try {
                await loadAccounts();
            } catch (err) {
                showMessage(msg, err.message, "error");
            }
        }
    })();
</script>
</body>
</html>
