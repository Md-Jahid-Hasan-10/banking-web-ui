<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transfer - Banking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav" class="nav"></nav>
<main class="container">
  <h1>Transfer money</h1>
  <div id="msg" class="msg" hidden></div>

  <section id="formCard" class="card">
    <form id="form1" novalidate>
      <div class="form-group">
        <label for="from">From account</label>
        <select id="from"></select>
      </div>
      <div class="form-group">
        <label for="to">To account number</label>
        <input id="to" type="text" maxlength="50" autocomplete="off" list="ownAccounts"
               placeholder="e.g. ACC-12345678">
        <datalist id="ownAccounts"></datalist>
        <div id="toHint" class="hint">Transfers between your own accounts are free. Other accounts have a fee.</div>
      </div>
      <div class="form-group">
        <label for="amount">Amount</label>
        <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
      </div>
      <button id="submit1" class="btn" type="submit">Continue</button>
    </form>
  </section>

  <section id="flow" hidden></section>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/flow.js"></script>
<script>
  (async function () {
    const session = requireAuth();
    if (!session) return;
    renderNav("transfer.html");

    const msg = $("msg");
    const formCard = $("formCard");
    const fromSel = $("from");
    const defaultHint = $("toHint").textContent;
    let accounts = [];

    async function loadAccounts() {
      const all = await Api.listAccounts();
      accounts = all.filter(function (a) { return !a.status || a.status === "ACTIVE"; });

      const previous = fromSel.value;
      fromSel.textContent = "";
      $("ownAccounts").textContent = "";
      accounts.forEach(function (a) {
        const opt = document.createElement("option");
        opt.value = a.accountNumber;
        opt.textContent = a.accountNumber + " (" + balanceText(a) + ")";
        fromSel.appendChild(opt);

        const suggestion = document.createElement("option");
        suggestion.value = a.accountNumber;
        $("ownAccounts").appendChild(suggestion);
      });
      if (previous) fromSel.value = previous;

      $("submit1").disabled = accounts.length === 0;
      if (accounts.length === 0) {
        showMessage(msg, "You need an active account first. Open one on the dashboard.", "error");
      }
    }

    function showForm() {
      flow.hide();
      formCard.hidden = false;
      window.history.replaceState(null, "", "transfer.html");
      hideMessage(msg);
      $("amount").value = "";
      loadAccounts().catch(function (err) { showMessage(msg, err.message, "error"); });
    }

    const flow = TxFlow.create($("flow"), {
      onNew: showForm,
      onFinished: function () {
        loadAccounts().catch(function () { /* the balances refresh when the form is shown again */ });
      }
    });

    // Only a hint. The server decides the real fee.
    $("to").addEventListener("input", function () {
      const v = $("to").value.trim();
      const hint = $("toHint");
      if (!v) {
        hint.textContent = defaultHint;
      } else if (accounts.some(function (a) { return a.accountNumber === v; })) {
        hint.textContent = "Your own account: no fee expected.";
      } else {
        hint.textContent = "Another account: a fee will apply.";
      }
    });

    $("form1").addEventListener("submit", async function (e) {
      e.preventDefault();
      hideMessage(msg);

      const fromAccountNumber = fromSel.value;
      const toAccountNumber = $("to").value.trim();
      const amountText = $("amount").value.trim();

      if (!fromAccountNumber) return showMessage(msg, "Choose the account to send from", "error");
      if (!toAccountNumber) return showMessage(msg, "Enter the destination account number", "error");
      if (toAccountNumber === fromAccountNumber) {
        return showMessage(msg, "Choose a different destination account", "error");
      }
      if (!/^\d+(\.\d{1,2})?$/.test(amountText) || Number(amountText) <= 0) {
        return showMessage(msg, "Enter a valid amount greater than 0 (max 2 decimals)", "error");
      }
      const amount = Number(amountText);

      const btn = $("submit1");
      setBusy(btn, true, "Sending...");
      try {
        const tx = await Api.initiateTransfer({
          fromAccountNumber: fromAccountNumber,
          toAccountNumber: toAccountNumber,
          amount: amount
        });

        if (tx.status !== "VALIDATING") {
          showMessage(msg, "The server still runs the old synchronous flow. "
                  + "Start fund-transfer-service with TRANSFER_SAGA_ENABLED=true.", "error");
        } else {
          formCard.hidden = true;
          window.history.replaceState(null, "", "transfer.html?id=" + encodeURIComponent(tx.transferId));
          flow.track(tx.transferId);
        }
      } catch (err) {
        showMessage(msg, err.message, "error");
      }
      setBusy(btn, false);
    });

    // A reload (or a link from History) resumes a running request.
    const resumeId = new URLSearchParams(window.location.search).get("id");
    if (resumeId) {
      formCard.hidden = true;
      flow.track(resumeId);
      loadAccounts().catch(function () { /* not needed to follow the request */ });
    } else {
      try {
        await loadAccounts();
      } catch (err) {
        showMessage(msg, err.message, "error");
      }
    }
  })();
</script>
</body>
</html>
